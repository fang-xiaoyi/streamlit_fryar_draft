name: Refresh USDA release snapshots

on:
  schedule:
    # Run on weekdays after the main USDA/NASS release window. The script is
    # idempotent, so checking daily is safe and catches delayed releases.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      months_back:
        description: "How many recent months to check"
        required: false
        default: "2"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline dependencies
        run: python -m pip install -r requirements.txt

      - name: Download, parse, validate, and generate reports
        env:
          MONTHS_BACK: ${{ inputs.months_back || '2' }}
        run: python scripts/refresh_usda.py --all --months-back "$MONTHS_BACK"

      - name: Commit new snapshots and reports
        shell: bash
        run: |
          if git diff --quiet -- data; then
            echo "No new validated USDA release."
            exit 0
          fi
          git config user.name "Fryar USDA Pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh USDA release snapshots"
          git push
